name: MASTERLAW P2P Control Plane CI

on:
  pull_request:
    paths:
      - 'exchange/**'
      - 'exchange-p2p-api.js'
      - 'migrations/2026-10-15_masterlaw_p2p_control_plane.sql'
      - 'test-p2p-access.js'
      - 'test-p2p-wallet-binding.js'
      - 'test-p2p-case-admin.js'
      - 'test-p2p-enforcement-gateway.js'
      - 'vercel.json'
      - '.github/workflows/p2p-control-plane-ci.yml'
  push:
    branches: [main]
    paths:
      - 'exchange/**'
      - 'exchange-p2p-api.js'
      - 'migrations/2026-10-15_masterlaw_p2p_control_plane.sql'
      - 'test-p2p-access.js'
      - 'test-p2p-wallet-binding.js'
      - 'test-p2p-case-admin.js'
      - 'test-p2p-enforcement-gateway.js'
      - 'vercel.json'
      - '.github/workflows/p2p-control-plane-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check exchange/p2p-access.js
          node --check exchange/p2p-wallet-binding.js
          node --check exchange/p2p-case-admin.js
          node --check exchange/p2p-enforcement-gateway.js
          node --check exchange-p2p-api.js
          node --check test-p2p-access.js
          node --check test-p2p-wallet-binding.js
          node --check test-p2p-case-admin.js
          node --check test-p2p-enforcement-gateway.js
      - name: KYC fail-closed policy test
        run: node test-p2p-access.js
      - name: Stateless wallet entitlement test
        run: node test-p2p-wallet-binding.js
      - name: Stateless admin case packet test
        run: node test-p2p-case-admin.js
      - name: Enforcement gateway test
        run: node test-p2p-enforcement-gateway.js
      - name: Validate isolated Vercel route and control surfaces
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'exchange-p2p-api.js' vercel.json
          grep -q '/api/exchange/p2p' vercel.json
          grep -q "app.post('/api/exchange/p2p/bind-wallet'" exchange-p2p-api.js
          grep -q "app.post('/api/exchange/p2p/verify-entitlement'" exchange-p2p-api.js
          grep -q "app.post('/api/exchange/p2p/gateway'" exchange-p2p-api.js
          grep -q "app.get('/api/exchange/p2p/admin/state-machine'" exchange-p2p-api.js
          grep -q "app.post('/api/exchange/p2p/admin/prepare-case'" exchange-p2p-api.js
          grep -q "app.post('/api/exchange/p2p/admin/prepare-evidence'" exchange-p2p-api.js
          grep -q "app.post('/api/exchange/p2p/admin/prepare-resolution'" exchange-p2p-api.js
          grep -q "P2P_ADMIN_ROLES || 'admin'" exchange-p2p-api.js
          grep -q "methods: \['GET','POST','OPTIONS'\]" exchange-p2p-api.js
          grep -q "allowedHeaders: \['Content-Type','Authorization','X-P2P-Session'\]" exchange-p2p-api.js
          grep -q 'database_mutation: false' exchange-p2p-api.js
          grep -q "identity_source: 'MASTERLAW_USUARIOS_ID'" exchange-p2p-api.js
          grep -q "MASTERLAW_P2P_ENTITLEMENT_V1" exchange/p2p-wallet-binding.js
          grep -q "INVALID_P2P_ENTITLEMENT_SUBJECT" exchange/p2p-wallet-binding.js
          grep -q "INVALID_P2P_ENTITLEMENT_KYC" exchange/p2p-wallet-binding.js
          grep -q "MASTERLAW_P2P_CASE_V1" exchange/p2p-case-admin.js
          grep -q "MASTERLAW_P2P_EVIDENCE_V1" exchange/p2p-case-admin.js
          grep -q "MASTERLAW_P2P_RESOLUTION_V1" exchange/p2p-case-admin.js
          grep -q "P2P_GATEWAY_ACTION_NOT_ALLOWED" exchange/p2p-enforcement-gateway.js
          grep -q "MASTERLAW_ENTITLEMENT_PLUS_SIGNED_P2P_SESSION" exchange/p2p-enforcement-gateway.js
          grep -q "real_money_enabled: false" exchange/p2p-wallet-binding.js
          grep -q "server_verification: '/api/exchange/p2p/verify-entitlement'" exchange-p2p-api.js
          grep -q "path: '/api/exchange/p2p/gateway'" exchange-p2p-api.js
          grep -q "mode: 'SANDBOX_ONLY'" exchange-p2p-api.js
          grep -q "identity_rechecked:true" exchange-p2p-api.js
          grep -q "entitlement_verifier:'STATELESS_PLUS_CURRENT_KYC_RECHECK'" exchange-p2p-api.js
          grep -q "enforcement_gateway:'AVAILABLE_SANDBOX_ONLY'" exchange-p2p-api.js
          grep -q "existing_edge_configuration_mutated:false" exchange-p2p-api.js
          grep -q "schema:'MASTERLAW_P2P_RELEASE_V1'" exchange-p2p-api.js
          grep -q 'VERCEL_GIT_COMMIT_SHA' exchange-p2p-api.js
          grep -q 'VERCEL_GIT_COMMIT_REF' exchange-p2p-api.js
          grep -q "version:'1.4.0-testnet'" exchange-p2p-api.js
          grep -q 'release:releaseMeta()' exchange-p2p-api.js
      - name: Guard gateway and non-custodial control plane
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '\.(insert|update|upsert|delete)\(' exchange/p2p-wallet-binding.js exchange/p2p-case-admin.js exchange/p2p-enforcement-gateway.js exchange-p2p-api.js
          ! grep -R -n -E 'eth_sendTransaction|private[_ -]?key|secretKey' exchange/p2p-wallet-binding.js exchange/p2p-case-admin.js exchange/p2p-enforcement-gateway.js exchange-p2p-api.js
          ! grep -R -n -E 'localStorage|sessionStorage' exchange/p2p-wallet-binding.js exchange/p2p-case-admin.js exchange/p2p-enforcement-gateway.js exchange-p2p-api.js
          grep -q "persistence:'NOT_WRITTEN'" exchange-p2p-api.js
          grep -q "browser_broadcast_allowed: false" exchange/p2p-case-admin.js
          grep -q "database_mutation: false" exchange/p2p-case-admin.js
          grep -q "database_mutation_by_gateway: false" exchange/p2p-enforcement-gateway.js
          grep -q "supabase_configuration_mutation: false" exchange/p2p-enforcement-gateway.js
          grep -q "real_money_enabled:false" exchange-p2p-api.js
          grep -q "next:'USE_MASTERLAW_P2P_GATEWAY_FOR_PROTECTED_SANDBOX_ACTIONS'" exchange-p2p-api.js
          ! grep -R -n -E 'auto_action:[[:space:]]*true' exchange/p2p-case-admin.js exchange-p2p-api.js
          node <<'NODE'
          const {PROTECTED_ACTIONS}=require('./exchange/p2p-enforcement-gateway');
          const expected=['create_offer','take_offer','mark_paid','release','cancel','dispute'].sort();
          const actual=[...PROTECTED_ACTIONS].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`gateway action drift: ${actual}`);
          console.log('P2P GATEWAY ALLOWLIST PASS',actual);
          NODE
      - name: Guard non-executed migration
        shell: bash
        run: |
          set -euo pipefail
          test -s migrations/2026-10-15_masterlaw_p2p_control_plane.sql
          grep -q 'PREPARED MIGRATION ONLY' migrations/2026-10-15_masterlaw_p2p_control_plane.sql
          ! grep -R -n -E 'supabase (db push|migration up)|psql .*masterlaw_p2p_control_plane' exchange exchange-p2p-api.js package.json vercel.json
